[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cdlib"
version = "0.1.0"
description = "Change-detection library — P5 scope: metrics, robustness, benchmark CLI, paper integration"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]
full = [
    "torchmetrics>=1.3",
    "monai>=1.3",
    "fvcore>=0.1.5",
    "albumentations>=1.4",
    "imagecorruptions>=1.1",
    "matplotlib>=3.8",
]

[project.scripts]
cd-benchmark = "cdlib.cli.benchmark:main"
cd-evaluate = "cdlib.cli.evaluate:main"
cd-export-masks = "cdlib.cli.export_masks:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires CUDA",
    "ffmpeg: requires ffmpeg with libx264",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
